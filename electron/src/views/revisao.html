
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Contet-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'">
    <title>Revisão</title>
    <script src="tema.js"></script>
    <link rel="stylesheet" href="../public/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">


    <style>

        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap');

        body {
            display: flex;
            height: 100vh;
            background-color: #E1DCD0;
            overflow-y: hidden;
            padding: 10px;
        }

        #main-area {
            min-width: 0;
        }

        #dashboard {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
        }

        /* ── Cabeçalho: título, contador e recarregar ── */
        #cabecalho-revisao {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 0 10px;
        }

        #cabecalho-revisao h2 {
            margin: 0;
        }

        #contador {
            background-color: var(--verde3);
            color: #fff;
            border-radius: 20px;
            padding: 2px 12px;
            font-size: 14px;
            font-weight: 700;
        }

        #btnRecarregar {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            border-radius: 15px;
            padding: 8px 18px;
            font-weight: 700;
            color: var(--verde3);
            background: linear-gradient(158deg, rgba(183, 206, 143, 1) 0%, rgba(126, 150, 86, 1) 100%);
            box-shadow: 4px 4px 5px -1px rgba(0,0,0,0.21);
            cursor: pointer;
        }

        #btnRecarregar:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #btnRecarregar svg {
            width: 16px;
            height: 16px;
        }

        #btnRecarregar.girando svg {
            animation: girar 0.8s linear infinite;
        }

        @keyframes girar { to { transform: rotate(360deg); } }

        /* ── Lista de cartões (mesmo painel branco das outras telas) ── */
        #listaRevisao {
            margin: 10px;
            padding: 20px;
            border-radius: 30px;
            background-color: var(--white);
            color: var(--verde4);
            flex-grow: 1;
            min-height: 0;
            overflow-y: auto;
            box-shadow: 8px 8px 10px -1px rgba(0,0,0,0.21);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .estado-lista {
            margin: auto;
            text-align: center;
            font-size: 16px;
            opacity: 0.8;
        }

        .card-revisao {
            display: grid;
            grid-template-columns: 150px minmax(0, 1fr) minmax(0, 1.1fr);
            gap: 28px;
            padding: 24px;
            border: 1px solid var(--bege);
            border-radius: 24px;
        }

        .card-imagem {
            width: 150px;
            height: 150px;
            border-radius: 18px;
            object-fit: cover;
            background-color: var(--bege);
        }

        .card-sem-imagem {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0.7;
        }

        .card-titulo {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 10px;
            overflow-wrap: anywhere;
        }

        .card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 15px;
        }

        .etiqueta {
            border-radius: 20px;
            padding: 4px 14px;
            background-color: var(--bege);
            color: var(--verde4);
            font-weight: 600;
        }

        .etiqueta.ong {
            background-color: var(--verde1);
            color: #344e41;
        }

        .secao-rotulo {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.7;
        }

        .card-descricao {
            font-size: 17px;
            line-height: 1.6;
            margin: 0;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        /* ── Análise da IA ── */
        .card-ia {
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding: 22px 24px;
            border-radius: 20px;
            background-color: var(--bege2);
            border-left: 5px solid var(--verde2);
            font-size: 16px;
        }

        .card-ia.alerta {
            border-left-color: #d4a017;
        }

        .ia-topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .ia-rotulo {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 0.75;
        }

        .ia-categoria {
            border-radius: 20px;
            padding: 4px 14px;
            font-size: 15px;
            font-weight: 700;
            background-color: #f3d9a4;
            color: #6b4a00;
        }

        .ia-confianca {
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 600;
        }

        .barra {
            flex-grow: 1;
            height: 12px;
            border-radius: 12px;
            background-color: rgba(0, 0, 0, 0.12);
            overflow: hidden;
        }

        .barra span {
            display: block;
            height: 100%;
            border-radius: 12px;
            background-color: var(--verde2);
        }

        .ia-confianca strong {
            min-width: 56px;
            text-align: right;
            font-size: 22px;
        }

        .ia-motivo {
            margin: 0;
            font-size: 16px;
            line-height: 1.55;
            overflow-wrap: anywhere;
        }

        .ia-data {
            font-size: 14px;
            opacity: 0.75;
        }

        .card-acoes {
            display: flex;
            gap: 12px;
            margin-top: auto;
            padding-top: 6px;
        }

        .btn-acao {
            flex: 1;
            border-radius: 14px;
            padding: 12px 16px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .btn-aprovar {
            border: none;
            background-color: var(--verde3);
            color: #fff;
        }

        .btn-aprovar:hover {
            background-color: var(--verde2);
        }

        .btn-rejeitar {
            border: 2px solid #c0392b;
            background-color: transparent;
            color: #c0392b;
        }

        .btn-rejeitar:hover {
            background-color: #c0392b;
            color: #fff;
        }

        body.dark #contador {
            background-color: var(--verde1);
            color: #344e41;
        }

        body.dark .ia-categoria {
            background-color: #5c4a1f;
            color: #f3d9a4;
        }

        body.dark .barra {
            background-color: rgba(255, 255, 255, 0.15);
        }

        body.dark .btn-rejeitar {
            border-color: #ff8a80;
            color: #ff8a80;
        }

        body.dark .btn-rejeitar:hover {
            background-color: #ff8a80;
            color: #303030;
        }

        @media (max-width: 1200px) {
            .card-revisao {
                grid-template-columns: 110px minmax(0, 1fr);
            }

            .card-imagem {
                width: 110px;
                height: 110px;
            }

            .card-ia {
                grid-column: 1 / -1;
            }
        }

        @media (max-width: 1000px) or (max-height: 680px) {
            #barra-lateral {
                font-size: 12px;
                width: 30% !important;
            }

            #sair {
                width: 100px;
            }

            #nomeAdm {
                font-size: 12px;
            }

            #emailAdm {
                font-size: 10px;
            }

            #navbar {
                width: 100%;
            }

            h2 {
                font-size: 20px;
            }

            #search {
                width: 180px;
                height: 25px;
            }

            #mutuo {
                font-size: 20px;
            }

            .icone-barra {
                height: 14px;
            }
        }

    </style>
</head>
<body class="m-0 light" id="pagina">

    <div class="wrapper fw-bold" id="barra-lateral">
        <a href="inicio.html"><span class="btn_barra"><img src="../public/img/dashboard.png" class="icone-barra">Início</a><br><hr>
        <a href="usuarios.html"><span class="btn_barra"><img src="../public/img/usuarios.png" class="icone-barra">Usuários</span></a><br><hr>
        <a href="ongs.html"><span class="btn_barra"><img src="../public/img/ongs.png" class="icone-barra">ONGS</span></a><br><hr>
        <a href="servicos.html"><span class="btn_barra"><img src="../public/img/servicos.png" class="icone-barra">Serviços</span></a><br><hr>
        <a href="solicitacoes.html"><span class="btn_barra"><img src="../public/img/notificacao.png" class="icone-barra">Solicitações</span></a><br><hr>
        <a href="#"><span class="btn_barra" style="background-color: #b7ce8fb3;"><img src="../public/img/notificacao.png" class="icone-barra">Revisão</span></a><br><hr>
        <a href="premium.html"><span class="btn_barra"><img src="../public/img/premium.png" class="icone-barra">Premium</span></a><br>
        <hr>
        <table>
            <tr>
                <td rowspan="2"><img src="../public/img/A.png"></td>
                <td><span id="nomeAdm"></span></td>
            </tr>
        </table>
        <button id="sair" type="button">Sair</button>
    </div>

    <div id="main-area">

        <nav class="navbar" id="navbar">
            <div class="container-fluid align-items-center">
                <a class="navbar-brand d-flex align-items-center"><img src="../public/img/mutuo_fundo.png" alt="Logo" width="40" height="40" class="d-inline-block"><span id="mutuo">Mútuo</span></a>
                <form class="d-flex mx-auto w-50" role="search">
                    <input class="form-control me-2" id="search" type="search" placeholder="Buscar por Serviço" aria-label="Search"/>
                </form>
                <div class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
                    <a class="nav-link active" id="tema" aria-current="page" href="#"><img id="img-tema" src="../public/img/escuro.png" height="25px"></a>
                    <a class="nav-link" href="perfil.html"><img src="../public/img/perfil.png" height="30px"></a>
                </div>
            </div>
        </nav>

        <div id="dashboard">
            <div id="cabecalho-revisao">
                <h2>Revisão de Serviços</h2>
                <span id="contador" hidden></span>
                <button id="btnRecarregar" type="button" title="Buscar serviços pendentes novamente">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/>
                    </svg>
                    Recarregar
                </button>
            </div>

            <div id="listaRevisao"></div>
        </div>

    </div>


    <link rel="stylesheet" href="../../node_modules/sweetalert2/dist/sweetalert2.min.css">

    <script src="../../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="../public/js/bootstrap.min.js"></script>
    <script>

        // Mesma base usada pelo main.js para chamar a API (imagens vêm de lá)
        const API_URL = 'https://mutuo-api.onrender.com';
        const lista = document.getElementById('listaRevisao');
        const contador = document.getElementById('contador');
        const btnRecarregar = document.getElementById('btnRecarregar');
        const inputBusca = document.getElementById('search');
        const admLogin = localStorage.getItem('usuarioLogado');
        let listaServicos = [];

        const CATEGORIAS = {
            VIOLENCIA: 'Violência',
            SEXUAL: 'Conteúdo sexual',
            EXPLORACAO: 'Exploração',
            DISCRIMINACAO: 'Discriminação',
            PERIGOSO: 'Atividade perigosa',
            ILICITO: 'Atividade ilícita',
            SPAM: 'Spam',
        };

        // Esta tela exibe exatamente o conteúdo suspeito: todo texto vindo da API é escapado.
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => (
            { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
        ));

        // A IA devolve a confiança entre 0 e 1 (o MySQL pode mandar como texto)
        function confiancaEmPorcentagem(valor) {
            if (valor === null || valor === undefined || valor === '') return null;
            const numero = Number(valor);
            if (!Number.isFinite(numero)) return null;
            return Math.round(Math.min(Math.max(numero, 0), 1) * 100);
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (admLogin) {
                document.getElementById('nomeAdm').textContent = " " + admLogin;
            }
            carregarLista();
        });

        btnRecarregar.addEventListener('click', carregarLista);

        async function carregarLista() {
            btnRecarregar.disabled = true;
            btnRecarregar.classList.add('girando');
            lista.innerHTML = '<p class="estado-lista">Carregando serviços pendentes...</p>';
            try {
                const servicos = await window.api.buscarServicosRevisao();
                if (!Array.isArray(servicos)) throw new Error(servicos?.erro || servicos?.error || 'Resposta inesperada.');
                listaServicos = servicos;
                contador.textContent = `${servicos.length} pendente${servicos.length === 1 ? '' : 's'}`;
                contador.hidden = false;
                aplicarBusca();
            } catch (err) {
                contador.hidden = true;
                lista.innerHTML = `<p class="estado-lista">Erro ao carregar: ${esc(err.message)}</p>`;
            } finally {
                btnRecarregar.disabled = false;
                btnRecarregar.classList.remove('girando');
            }
        }

        function renderizarLista(servicos) {
            if (servicos.length === 0) {
                lista.innerHTML = listaServicos.length === 0
                    ? '<p class="estado-lista">Nenhum serviço pendente de revisão. 🎉</p>'
                    : '<p class="estado-lista">Nenhum serviço encontrado para essa busca.</p>';
                return;
            }

            lista.innerHTML = servicos.map(s => {
                const confianca = confiancaEmPorcentagem(s.moderacao_confianca);
                const categoria = s.moderacao_categoria
                    ? (CATEGORIAS[s.moderacao_categoria] || s.moderacao_categoria)
                    : null;

                return `
                <article class="card-revisao">
                    ${s.imagem
                        ? `<img class="card-imagem" src="${esc(API_URL + s.imagem)}" alt="">`
                        : '<div class="card-imagem card-sem-imagem">Sem imagem</div>'}

                    <div>
                        <h3 class="card-titulo">${esc(s.nomeServico)}</h3>
                        <div class="card-meta">
                            <span class="etiqueta ${s.tipo === 'ong' ? 'ong' : ''}">${s.tipo === 'ong' ? 'ONG' : 'Usuário'}</span>
                            <span class="etiqueta">${esc(s.nomeCriador || '-')}</span>
                            ${s.foco ? `<span class="etiqueta">${esc(s.foco)}</span>` : ''}
                            ${s.horas ? `<span class="etiqueta">${esc(s.horas)} h</span>` : ''}
                        </div>
                        <span class="secao-rotulo">Descrição</span>
                        <p class="card-descricao">${esc(s.descricao || 'Sem descrição.')}</p>
                    </div>

                    <div class="card-ia ${categoria ? 'alerta' : ''}">
                        <div class="ia-topo">
                            <span class="ia-rotulo">Análise da IA</span>
                            ${categoria ? `<span class="ia-categoria">${esc(categoria)}</span>` : ''}
                        </div>
                        <div class="ia-confianca" title="Confiança da IA na própria análise">
                            <span>Confiança</span>
                            ${confianca === null
                                ? '<strong style="margin-left:auto">-</strong>'
                                : `<div class="barra"><span style="width:${confianca}%"></span></div><strong>${confianca}%</strong>`}
                        </div>
                        <p class="ia-motivo">${esc(s.moderacao_motivo || 'A IA não informou um motivo.')}</p>
                        ${s.moderacao_data
                            ? `<span class="ia-data">Analisado em ${esc(new Date(s.moderacao_data).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }))}</span>`
                            : ''}
                        <div class="card-acoes">
                            <button class="btn-acao btn-aprovar" data-tipo="${esc(s.tipo)}" data-id="${esc(s.id)}" data-acao="APROVAR">Aprovar</button>
                            <button class="btn-acao btn-rejeitar" data-tipo="${esc(s.tipo)}" data-id="${esc(s.id)}" data-acao="REJEITAR">Rejeitar</button>
                        </div>
                    </div>
                </article>`;
            }).join('');
        }

        // data-* em vez de onclick com valores interpolados (escape HTML não protege dentro de JS inline)
        lista.addEventListener('click', (e) => {
            const botao = e.target.closest('button[data-acao]');
            if (botao) moderar(botao.dataset.tipo, botao.dataset.id, botao.dataset.acao);
        });

        async function moderar(tipo, id, acao) {
            const aprovar = acao === 'APROVAR';
            const confirmado = await Swal.fire({
                title: aprovar ? 'Aprovar serviço?' : 'Rejeitar serviço?',
                text: aprovar
                    ? 'O serviço será publicado e ficará visível para todos.'
                    : 'O serviço não será publicado.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: aprovar ? 'Aprovar' : 'Rejeitar',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: aprovar ? '#3a5a40' : '#c0392b',
                heightAuto: false
            });
            if (!confirmado.isConfirmed) return;

            try {
                const resultado = await window.api.moderarServico(tipo, id, acao, admLogin);
                if (resultado?.sucesso) {
                    Swal.fire({
                        title: aprovar ? 'Serviço aprovado!' : 'Serviço rejeitado.',
                        icon: 'success',
                        confirmButtonColor: '#3a5a40',
                        heightAuto: false
                    });
                    carregarLista();
                } else {
                    Swal.fire({ title: 'Erro', text: resultado?.erro || resultado?.error || 'Não foi possível concluir.', icon: 'error', confirmButtonColor: '#3a5a40', heightAuto: false });
                }
            } catch (err) {
                Swal.fire({ title: 'Erro', text: err.message || 'Não foi possível concluir.', icon: 'error', confirmButtonColor: '#3a5a40', heightAuto: false });
            }
        }

        const buttonSair = document.getElementById('sair');

        buttonSair.addEventListener('click', () => {
            localStorage.removeItem('usuarioLogado');
            window.api.abrirJanelaLogin();
        });

        function aplicarBusca() {
            const texto = inputBusca.value.toLowerCase().trim();
            const filtrados = listaServicos.filter(servico =>
                String(servico.nomeServico || '').toLowerCase().includes(texto)
            );
            renderizarLista(filtrados);
        }

        let timeout;

        inputBusca.addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(aplicarBusca, 300);
        });
    </script>
</body>
</html>
