<body class="m-0 light" id="pagina">

    <div class="wrapper fw-bold" id="barra-lateral">
        <a href="inicio.html"><span class="btn_barra"><img src="../public/img/dashboard.png" class="icone-barra">Início</a><br><hr>
        <a href="usuarios.html"><span class="btn_barra"><img src="../public/img/usuarios.png" class="icone-barra">Usuários</span></a><br><hr>
        <a href="ongs.html"><span class="btn_barra"><img src="../public/img/ongs.png" class="icone-barra">ONGS</span></a><br><hr>
        <a href="servicos.html"><span class="btn_barra"><img src="../public/img/servicos.png" class="icone-barra">Serviços</span></a><br><hr>
        <a href="solicitacoes.html"><span class="btn_barra"><img src="../public/img/notificacao.png" class="icone-barra">Solicitações</span></a><br><hr>
        <a href="#"><span class="btn_barra" style="background-color: #b7ce8fb3;"><img src="../public/img/premium.png" class="icone-barra">Premium</span></a><br>
        <hr>
        <table>
            <tr>
                <td rowspan="2"><img src="../public/img/A.png"></td>
                <td><span id="nomeAdm"></span></td>
            </tr>
        </table>
        <button id="sair" type="button">Sair</button>
    </div> 

    <div id="main-area">

        <nav class="navbar" id="navbar">
            <div class="container-fluid align-items-center">
                <a class="navbar-brand d-flex align-items-center"><img src="../public/img/mutuo_fundo.png" alt="Logo" width="40" height="40" class="d-inline-block"><span id="mutuo">Mútuo</span></a>
                <form class="d-flex mx-auto w-50" role="search">
                    <input class="form-control me-2" id="search" type="search" placeholder="Buscar ONG premium" aria-label="Search"/>
                </form>
                <div class="navbar-nav ms-auto d-flex flex-row gap-3 align-items-center">
                    <a class="nav-link active" id="tema" aria-current="page" href="#"><img id="img-tema" src="../public/img/escuro.png" height="25px"></a>
                    <a class="nav-link" href="perfil.html"><img src="../public/img/perfil.png" height="30px"></a>
                </div>
            </div>
        </nav>

        <div id="dashboard">
            <h2>Gerenciamento de Plano Premium</h2>
            <div class="container text-center">
                <div class="row">
                    <div class="col">
                        <span class="col-titulo">ONGs Premium</span>
                        <br>
                        <span class="col-texto"><img src="../public/img/ongs_claro.png" height="25px" class="icone_card"><span id="totalOngsPremium">--</span></span>
                    </div>
                    <div class="col">
                        <span class="col-titulo">Usuários Premium</span>
                        <br>
                        <span class="col-texto"><img src="../public/img/usuarios_claro.png" height="25px" class="icone_card"><span id="totalUsuariosPremium">--</span></span>
                    </div>
                    <div class="col">
                        <span class="col-titulo">Receita Mensal</span>
                        <br>
                        <span class="col-texto"><img src="../public/img/servicos_claro.png" height="25px" class="icone_card"><span id="receitaTotal">--</span></span>
                    </div>
                </div>
            </div>

            <div id="divTabela">
                <table id="tabela">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>E-mail</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">

                    </tbody>
                </table>
            </div>

        </div>
            
            

    <link rel="stylesheet" href="../../node_modules/sweetalert2/dist/sweetalert2.min.css">

    <!--<script src="../../renderer.js"></script>-->
    <script src="../../node_modules/sweetalert2/dist/sweetalert2.all.min.js"></script>
    <script src="../public/js/bootstrap.min.js"></script>
    <script>

        window.addEventListener('DOMContentLoaded', async () => {

            const usuario = localStorage.getItem('usuarioLogado');

            if (usuario) {
                document.getElementById('nomeAdm').textContent = " " + usuario;
            }

            carregarContasPremium();

        })

        let contasPremium = [];

        async function carregarContasPremium() {
            const corpo = document.getElementById('tbody');
            try {
                contasPremium = await window.api.buscarContasPremium();

                if (!Array.isArray(contasPremium)) throw new Error(contasPremium?.erro || 'Erro ao carregar dados.');

                atualizarContadores(contasPremium);
                renderizarTabelaPremium(contasPremium);
            } catch (erro) {
                console.error('Erro ao buscar contas premium:', erro);
                corpo.innerHTML = `<tr><td colspan="4" class="tdTabela">Erro ao carregar dados: ${erro.message}</td></tr>`;
            }
        }

        const PRECO_PREMIUM_USUARIO = 19.90;
        const PRECO_PREMIUM_ONG = 49.90;

        function atualizarContadores(lista) {
            const totalOngs = lista.filter(c => c.tipo === 'ONG').length;
            const totalUsuarios = lista.filter(c => c.tipo === 'Usuário').length;

            document.getElementById('totalOngsPremium').textContent = totalOngs;
            document.getElementById('totalUsuariosPremium').textContent = totalUsuarios;

            const receita = (totalUsuarios * PRECO_PREMIUM_USUARIO) + (totalOngs * PRECO_PREMIUM_ONG);
            document.getElementById('receitaTotal').textContent = receita.toLocaleString('pt-BR', {
                style: 'currency',
                currency: 'BRL'
            });
        }

        function renderizarTabelaPremium(lista) {
            const corpo = document.getElementById('tbody');
            corpo.innerHTML = '';

            if (lista.length === 0) {
                corpo.innerHTML = '<tr><td colspan="4" class="tdTabela">Nenhuma conta premium encontrada.</td></tr>';
                return;
            }

            for (const conta of lista) {
                const linha = document.createElement('tr');
                linha.innerHTML = `
                    <td class="tdTabela">${conta.nome}</td>
                    <td class="tdTabela">${conta.tipo}</td>
                    <td class="tdTabela">${conta.email || '-'}</td>
                    <td class="tdTabela" style="width: 140px;">
                        <button class="btn-remover-premium" data-id="${conta.id}" data-tipo="${conta.tipo}">Remover</button>
                    </td>
                `;
                corpo.appendChild(linha);
            }

            document.querySelectorAll('.btn-remover-premium').forEach(btn => {
                btn.addEventListener('click', () => removerPremium(btn.dataset.id, btn.dataset.tipo, btn));
            });
        }

        async function removerPremium(id, tipo, botao) {
            const confirmar = await Swal.fire({
                title: 'Remover Premium?',
                text: 'Essa conta perderá os benefícios do plano Premium.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Remover',
                cancelButtonText: 'Cancelar'
            });

            if (!confirmar.isConfirmed) return;

            botao.disabled = true;
            botao.textContent = 'Removendo...';

            try {
                if (tipo === 'ONG') {
                    await window.api.removerPremiumOng(id);
                } else {
                    await window.api.removerPremiumUsuario(id);
                }
                await carregarContasPremium();
            } catch (erro) {
                console.error('Erro ao remover premium:', erro);
                Swal.fire('Erro', 'Não foi possível remover o Premium.', 'error');
                botao.disabled = false;
                botao.textContent = 'Remover Premium';
            }
        }

        // Busca por nome (reaproveita o input#search que já existe na navbar)
        document.getElementById('search')?.addEventListener('input', function () {
            const termo = this.value.toLowerCase();
            const filtrado = contasPremium.filter(c => c.nome.toLowerCase().includes(termo));
            renderizarTabelaPremium(filtrado);
        });

        const buttonSair = document.getElementById('sair');

        buttonSair.addEventListener('click', () => {
            localStorage.removeItem('usuarioLogado');
            window.api.abrirJanelaLogin();
        });
    </script>
</body>

</html>
