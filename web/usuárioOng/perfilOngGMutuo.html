<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mútuo | Meus serviços</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" href="../imagens/mutuoLogo.png">

  <style>
    :root {
      --verde-principal: #588157;
      --verde-escuro: #3a5a40;
      --verde-palido: #eaf2e6;
      --verde-badge: #b7ce8f;
      --creme: #e1dcd0;
      --vermelho: #b00020;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 30px 14px;
      color: #1a2e1b;
      background: #f2f5f1;
      font-family: "Quicksand", sans-serif;
    }

    .pagina {
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
    }

    .bloco {
      padding: 24px;
      border: 1px solid #e4ebe2;
      border-radius: 20px;
      background: white;
      box-shadow: 0 4px 18px rgba(58, 90, 64, 0.05);
    }

    .cabecalho-bloco {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .cabecalho-bloco h3 {
      margin-bottom: 2px;
      color: var(--verde-escuro);
      font-size: 1rem;
      font-weight: 700;
    }

    .cabecalho-bloco p {
      color: #9aab96;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .badge-limite-servicos {
      display: none;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
      padding: 5px 12px;
      border-radius: 20px;
      color: var(--verde-escuro);
      background: var(--verde-palido);
      font-size: 0.76rem;
      font-weight: 700;
    }

    .badge-limite-servicos.limite-atingido {
      color: #b3690a;
      background: #fdeeda;
    }

    .badge-limite-servicos a {
      color: inherit;
      font-weight: 700;
      text-decoration: underline;
    }

    .btn-adicionar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 8px 18px;
      border-radius: 20px;
      color: white;
      background: var(--verde-principal);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition:
        background 0.18s,
        opacity 0.18s;
    }

    .btn-adicionar:hover {
      color: white;
      background: var(--verde-escuro);
    }

    .btn-adicionar.desabilitado {
      cursor: not-allowed;
      pointer-events: none;
      opacity: 0.5;
    }

    .lista-servicos {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-servico {
      padding: 18px;
      border: 1px solid #e4ebe2;
      border-radius: 16px;
      background: white;
      transition:
        box-shadow 0.18s,
        transform 0.18s;
    }

    .card-servico:hover {
      box-shadow: 0 4px 14px rgba(58, 90, 64, 0.1);
      transform: translateY(-1px);
    }

    .topo-servico {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }

    .topo-servico h4 {
      color: #1a2e1b;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .tag-ativo {
      padding: 3px 10px;
      border-radius: 20px;
      color: #2d6a4f;
      background: #e6f4ea;
      font-size: 0.7rem;
      font-weight: 700;
    }

    .descricao-servico {
      margin-bottom: 14px;
      color: #7a8c76;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .rodape-servico {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .avaliacao-servico {
      display: flex;
      align-items: center;
      gap: 4px;
      color: #f5a623;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .avaliacao-servico span {
      color: #7a8c76;
    }

    .pontos-servico {
      display: flex;
      align-items: center;
      gap: 4px;
      color: var(--verde-principal);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .acoes-servico {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-left: auto;
    }

    .btn-excluir,
    .btn-editar {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 16px;
      border: none;
      border-radius: 20px;
      font-family: "Quicksand", sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.18s;
    }

    .btn-excluir {
      color: var(--vermelho);
      background: #fde8e8;
    }

    .btn-excluir:hover {
      background: #ffcccc;
    }

    .btn-editar {
      color: var(--verde-escuro);
      background: var(--verde-palido);
    }

    .btn-editar:hover {
      color: var(--verde-escuro);
      background: var(--verde-badge);
    }

    .estado-lista {
      padding: 24px 10px;
      color: #9aab96;
      font-size: 0.85rem;
      text-align: center;
    }

    .estado-lista.erro {
      color: var(--vermelho);
    }

    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      margin-right: 7px;
      border: 2px solid #dbe5d8;
      border-top-color: var(--verde-principal);
      border-radius: 50%;
      vertical-align: middle;
      animation: girar 0.7s linear infinite;
    }

    @keyframes girar {
      to {
        transform: rotate(360deg);
      }
    }

    /* Modal de confirmação */

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(26, 46, 27, 0.48);
      backdrop-filter: blur(2px);
    }

    .modal-overlay.visivel {
      display: flex;
    }

    .modal-confirmacao {
      width: 100%;
      max-width: 390px;
      padding: 32px;
      border-radius: 22px;
      background: white;
      text-align: center;
      box-shadow: 0 22px 65px rgba(26, 46, 27, 0.25);
    }

    .icone-modal {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 16px;
      border-radius: 50%;
      color: var(--vermelho);
      background: #fde8e8;
      font-size: 1.8rem;
    }

    .modal-confirmacao h3 {
      margin-bottom: 8px;
      color: var(--verde-escuro);
      font-size: 1.2rem;
    }

    .modal-confirmacao p {
      margin-bottom: 22px;
      color: #7a8c76;
      font-size: 0.86rem;
      line-height: 1.5;
    }

    .acoes-modal {
      display: flex;
      gap: 10px;
    }

    .acoes-modal button {
      flex: 1;
      padding: 10px 14px;
      border-radius: 20px;
      font-family: "Quicksand", sans-serif;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-cancelar {
      border: 1px solid #d9e2d6;
      color: var(--verde-escuro);
      background: white;
    }

    .btn-confirmar {
      border: none;
      color: white;
      background: var(--vermelho);
    }

    .btn-confirmar:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* Notificação */

    .notificacao {
      position: fixed;
      top: 24px;
      left: 50%;
      z-index: 2000;
      display: none;
      align-items: center;
      gap: 9px;
      width: min(90%, 430px);
      padding: 13px 18px;
      border-radius: 14px;
      color: #24522d;
      background: #e1f4e5;
      font-size: 0.84rem;
      font-weight: 700;
      box-shadow: 0 8px 26px rgba(33, 53, 37, 0.18);
      transform: translateX(-50%);
    }

    .notificacao.visivel {
      display: flex;
    }

    .notificacao.erro {
      color: #812f2f;
      background: #fbe4e4;
    }

    @media (max-width: 600px) {
      .bloco {
        padding: 18px;
      }

      .cabecalho-bloco {
        align-items: stretch;
      }

      .btn-adicionar {
        justify-content: center;
      }

      .rodape-servico {
        align-items: flex-start;
        flex-direction: column;
      }

      .acoes-servico {
        width: 100%;
        margin-left: 0;
      }

      .btn-excluir,
      .btn-editar {
        justify-content: center;
        flex: 1;
      }
    }

    @media (max-width: 430px) {
      .cabecalho-bloco {
        flex-direction: column;
      }

      .acoes-modal {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <main class="pagina">
    <section class="bloco">
      <div class="cabecalho-bloco">
        <div>
          <h3>Meus serviços</h3>

          <p>
            Serviços que você oferece na plataforma
          </p>

          <span
            class="badge-limite-servicos"
            id="badgeLimiteServicos"
          ></span>
        </div>

        <a
          href="adicionarServicoMutuo.html"
          class="btn-adicionar"
          id="btnAdicionarServico"
        >
          <i class="bi bi-plus-lg"></i>
          Adicionar
        </a>
      </div>

      <div
        class="lista-servicos"
        id="listaServicosMutuo"
      >
        <div class="estado-lista">
          <span class="spinner"></span>
          Carregando seus serviços...
        </div>
      </div>
    </section>
  </main>

  <!-- Modal para excluir -->

  <div class="modal-overlay" id="modalExcluir">
    <div class="modal-confirmacao">
      <div class="icone-modal">
        <i class="bi bi-trash3-fill"></i>
      </div>

      <h3>Excluir serviço?</h3>

      <p>
        O serviço será desativado e deixará de aparecer
        na plataforma. Deseja continuar?
      </p>

      <div class="acoes-modal">
        <button
          type="button"
          class="btn-cancelar"
          id="btnCancelarExclusao"
        >
          Cancelar
        </button>

        <button
          type="button"
          class="btn-confirmar"
          id="btnConfirmarExclusao"
        >
          Sim, excluir
        </button>
      </div>
    </div>
  </div>

  <!-- Notificação -->

  <div class="notificacao" id="notificacao">
    <i id="iconeNotificacao" class="bi"></i>
    <span id="textoNotificacao"></span>
  </div>

  <script>
    /*
     * Para usar a API local:
     */
    const API_BASE = "http://localhost:3000";

    /*
     * Para usar o Render, troque a linha acima por:
     * const API_BASE = "https://mutuo-api.onrender.com";
     */

    const usuario = JSON.parse(
      sessionStorage.getItem("usuarioLogado") || "{}"
    );

    const container =
      document.getElementById("listaServicosMutuo");

    const badge =
      document.getElementById("badgeLimiteServicos");

    const btnAdicionar =
      document.getElementById("btnAdicionarServico");

    const modalExcluir =
      document.getElementById("modalExcluir");

    const btnCancelarExclusao =
      document.getElementById("btnCancelarExclusao");

    const btnConfirmarExclusao =
      document.getElementById("btnConfirmarExclusao");

    let idServicoParaExcluir = null;
    let temporizadorNotificacao = null;

    if (!usuario.cpf) {
      window.location.replace("../login.html");
    } else {
      carregarServicosUsuario();
    }

    function escaparHtml(valor) {
      const elemento = document.createElement("div");
      elemento.textContent = String(valor ?? "");
      return elemento.innerHTML;
    }

    function criarCardServicoUsuario(servico) {
      const card = document.createElement("article");
      card.className = "card-servico";

      const id =
        servico.id ??
        servico.cod;

      const nome = escaparHtml(
        servico.nomeServico ||
        servico.nome ||
        "Serviço sem nome"
      );

      const descricao = escaparHtml(
        servico.descricao || ""
      );

      const notaBruta =
        servico.nota ??
        servico.avaliacao;

      const nota = Number(notaBruta) > 0
        ? Number(notaBruta).toFixed(1)
        : "—";

      const avaliacoes =
        Number(servico.avaliacoes) || 0;

      const pontos =
        Number(servico.pontos) || 0;

      card.innerHTML = `
        <div class="topo-servico">
          <h4>${nome}</h4>
          <span class="tag-ativo">Ativo</span>
        </div>

        <p class="descricao-servico">
          ${descricao || "Serviço sem descrição."}
        </p>

        <div class="rodape-servico">
          <div class="avaliacao-servico">
            <i class="bi bi-star-fill"></i>
            ${nota}
            <span>(${avaliacoes} avaliações)</span>
          </div>

          <div class="pontos-servico">
            <i class="bi bi-lightning-charge-fill"></i>
            ${pontos} pts/hora
          </div>

          <div class="acoes-servico">
            <button
              type="button"
              class="btn-excluir"
            >
              <i class="bi bi-trash3"></i>
              Excluir
            </button>

            <a
              href="editarServicoMutuo.html?id=${encodeURIComponent(id)}"
              class="btn-editar"
            >
              <i class="bi bi-pencil"></i>
              Editar
            </a>
          </div>
        </div>
      `;

      card
        .querySelector(".btn-excluir")
        .addEventListener("click", function () {
          abrirModalExclusao(id);
        });

      return card;
    }

    async function carregarServicosUsuario() {
      mostrarCarregando();

      try {
        const resposta = await fetch(
          `${API_BASE}/servicos/usuario/${encodeURIComponent(usuario.cpf)}`
        );

        const resultado =
          await lerRespostaJson(resposta);

        if (!resposta.ok) {
          throw new Error(
            resultado.erro ||
            resultado.error ||
            "Não foi possível carregar seus serviços."
          );
        }

        const listaRecebida =
          Array.isArray(resultado)
            ? resultado
            : resultado.servicos || [];

        /*
         * Considera apenas serviços ativos.
         */
        const listaAtiva = listaRecebida.filter(
          function (servico) {
            return (
              servico.ativo === undefined ||
              servico.ativo === true ||
              Number(servico.ativo) === 1
            );
          }
        );

        container.innerHTML = "";

        if (listaAtiva.length === 0) {
          container.innerHTML = `
            <div class="estado-lista">
              Você ainda não cadastrou nenhum serviço.
            </div>
          `;
        } else {
          listaAtiva.forEach(function (servico) {
            container.appendChild(
              criarCardServicoUsuario(servico)
            );
          });
        }

        await atualizarLimite(listaAtiva.length);
      } catch (erro) {
        console.error(
          "Erro ao carregar serviços:",
          erro
        );

        container.innerHTML = `
          <div class="estado-lista erro">
            <i class="bi bi-exclamation-circle"></i>
            ${escaparHtml(
              erro.message ||
              "Erro ao carregar seus serviços."
            )}
          </div>
        `;
      }
    }

    async function atualizarLimite(totalAtual) {
      let premium =
        Number(usuario.premium) === 1 ||
        usuario.premium === true;

      /*
       * Consulta o banco para não depender somente
       * dos dados antigos da sessão.
       */
      try {
        const resposta = await fetch(
          `${API_BASE}/usuarios/${encodeURIComponent(usuario.cpf)}`
        );

        if (resposta.ok) {
          const dados = await resposta.json();

          let valorPremium = dados.premium;

          if (
            valorPremium &&
            typeof valorPremium === "object" &&
            Array.isArray(valorPremium.data)
          ) {
            valorPremium = valorPremium.data[0];
          }

          premium =
            Number(valorPremium) === 1 ||
            valorPremium === true;

          usuario.premium = premium ? 1 : 0;

          sessionStorage.setItem(
            "usuarioLogado",
            JSON.stringify(usuario)
          );
        }
      } catch (erro) {
        console.error(
          "Erro ao verificar o plano:",
          erro
        );
      }

      const limite = premium ? 8 : 3;
      const atingiuLimite = totalAtual >= limite;

      badge.style.display = "inline-flex";

      badge.classList.toggle(
        "limite-atingido",
        atingiuLimite
      );

      if (atingiuLimite && !premium) {
        badge.innerHTML = `
          <i class="bi bi-lightning-charge-fill"></i>

          <span>
            ${totalAtual}/${limite} serviços usados —
            <a href="planosMutuo.html">vire Premium</a>
            para cadastrar até 8
          </span>
        `;
      } else if (atingiuLimite && premium) {
        badge.innerHTML = `
          <i class="bi bi-lightning-charge-fill"></i>

          <span>
            ${totalAtual}/${limite} serviços usados —
            limite Premium atingido
          </span>
        `;
      } else {
        badge.innerHTML = `
          <i class="bi bi-lightning-charge-fill"></i>

          <span>
            ${totalAtual}/${limite} serviços usados
          </span>
        `;
      }

      if (atingiuLimite) {
        btnAdicionar.classList.add("desabilitado");
        btnAdicionar.removeAttribute("href");

        btnAdicionar.setAttribute(
          "aria-disabled",
          "true"
        );

        btnAdicionar.title = premium
          ? "Limite de serviços Premium atingido."
          : "Limite atingido. Vire Premium para cadastrar mais.";
      } else {
        btnAdicionar.classList.remove("desabilitado");

        btnAdicionar.href =
          "adicionarServicoMutuo.html";

        btnAdicionar.setAttribute(
          "aria-disabled",
          "false"
        );

        btnAdicionar.title = "";
      }
    }

    function abrirModalExclusao(id) {
      idServicoParaExcluir = id;
      modalExcluir.classList.add("visivel");
    }

    function fecharModalExclusao() {
      idServicoParaExcluir = null;
      modalExcluir.classList.remove("visivel");
    }

    btnCancelarExclusao.addEventListener(
      "click",
      fecharModalExclusao
    );

    modalExcluir.addEventListener(
      "click",
      function (evento) {
        if (evento.target === modalExcluir) {
          fecharModalExclusao();
        }
      }
    );

    btnConfirmarExclusao.addEventListener(
      "click",
      excluirServicoUsuario
    );

    async function excluirServicoUsuario() {
      if (idServicoParaExcluir === null) {
        return;
      }

      const id = idServicoParaExcluir;

      btnConfirmarExclusao.disabled = true;
      btnConfirmarExclusao.textContent =
        "Excluindo...";

      try {
        const resposta = await fetch(
          `${API_BASE}/servicos/${encodeURIComponent(id)}/status`,
          {
            method: "PATCH",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              ativo: 0
            })
          }
        );

        const resultado =
          await lerRespostaJson(resposta);

        if (!resposta.ok) {
          throw new Error(
            resultado.erro ||
            resultado.error ||
            "Não foi possível excluir o serviço."
          );
        }

        fecharModalExclusao();

        mostrarNotificacao(
          "Serviço excluído com sucesso.",
          "sucesso"
        );

        /*
         * Recarrega a lista e atualiza:
         * - contador;
         * - badge;
         * - botão Adicionar.
         */
        await carregarServicosUsuario();
      } catch (erro) {
        console.error(
          "Erro ao excluir serviço:",
          erro
        );

        fecharModalExclusao();

        mostrarNotificacao(
          erro.message ||
          "Não foi possível excluir o serviço.",
          "erro"
        );
      } finally {
        btnConfirmarExclusao.disabled = false;
        btnConfirmarExclusao.textContent =
          "Sim, excluir";
      }
    }

    function mostrarCarregando() {
      container.innerHTML = `
        <div class="estado-lista">
          <span class="spinner"></span>
          Carregando seus serviços...
        </div>
      `;
    }

    function mostrarNotificacao(texto, tipo) {
      const notificacao =
        document.getElementById("notificacao");

      const icone =
        document.getElementById("iconeNotificacao");

      const textoElemento =
        document.getElementById("textoNotificacao");

      clearTimeout(temporizadorNotificacao);

      textoElemento.textContent = texto;

      notificacao.classList.toggle(
        "erro",
        tipo === "erro"
      );

      icone.className = tipo === "erro"
        ? "bi bi-exclamation-circle-fill"
        : "bi bi-check-circle-fill";

      notificacao.classList.add("visivel");

      temporizadorNotificacao = setTimeout(
        function () {
          notificacao.classList.remove("visivel");
        },
        4000
      );
    }

    async function lerRespostaJson(resposta) {
      const texto = await resposta.text();

      if (!texto) {
        return {};
      }

      try {
        return JSON.parse(texto);
      } catch (erro) {
        throw new Error(
          `A API devolveu uma resposta inválida. Status: ${resposta.status}.`
        );
      }
    }
  </script>

</body>
</html>
