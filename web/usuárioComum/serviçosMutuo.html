<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mútuo | Serviços</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="icon" href="../imagens/mutuoLogo.png">
  <style>
 :root {
  --green-main:  #588157;
  --green-dark:  #3a5a40;
  --cream:       #E1DCD0;
  --cream-light: #f0ede6;
  --white:       #ffffff;
  --text-dark:   #1e2e1f;
  --text-muted:  #7a8c78;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Quicksand', sans-serif;
  background-color: var(--white);
  color: var(--text-dark);
  padding-top: 72px;
}

/* ── NAVBAR ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  background-color: var(--green-main);
  height: 72px;
  display: flex; align-items: center;
  padding: 0 2rem;
  box-shadow: 0 2px 16px rgba(58,90,64,0.25);
}
.nav-brand {
  display: flex; align-items: center; gap: 10px;
  text-decoration: none;
  font-size: 1.55rem; color: var(--cream);
  letter-spacing: 0.4px; margin-right: 2rem; flex-shrink: 0;
}
.nav-brand img { width: 38px; height: 38px; border-radius: 8px; }
.nav-links {
  display: flex; align-items: center; gap: 2px;
  list-style: none; flex: 1;
}
.nav-links a {
  text-decoration: none; color: rgba(225,220,208,0.82);
  font-size: 0.875rem; font-weight: 500;
  padding: 0.45rem 0.9rem; border-radius: 8px;
  transition: color 0.18s, background 0.18s; white-space: nowrap;
}
.nav-links a:hover, .nav-links a.active {
  color: var(--cream); background: rgba(255,255,255,0.12);
}
.nav-dropdown { position: relative; }
.nav-dropdown > a { display: flex; align-items: center; gap: 5px; }
.dropdown-panel {
  display: none; position: absolute; top: 100%; left: 0;
  padding-top: 10px; min-width: 215px;
}
.dropdown-panel-inner {
  background: var(--green-dark); border-radius: 12px; overflow: hidden;
  box-shadow: 0 8px 28px rgba(0,0,0,0.22);
  border: 1px solid rgba(225,220,208,0.1);
}
.nav-dropdown:hover .dropdown-panel { display: block; }
.dropdown-panel a {
  display: flex; align-items: center; gap: 9px;
  color: rgba(225,220,208,0.8); padding: 0.65rem 1.1rem;
  font-size: 0.84rem; text-decoration: none;
  transition: background 0.15s, color 0.15s;
}
.dropdown-panel a:hover { background: rgba(255,255,255,0.08); color: var(--cream); }
.dropdown-panel a.danger { color: rgba(255,140,140,0.75); border-top: 1px solid rgba(225,220,208,0.1); }
.nav-right { display: flex; align-items: center; gap: 1rem; margin-left: auto; }
.nav-bell {
  position: relative; cursor: pointer;
  color: var(--cream); font-size: 1.25rem; opacity: 0.8;
  transition: opacity 0.2s; text-decoration: none;
}
.nav-bell:hover { opacity: 1; }
.bell-badge {
  position: absolute; top: -5px; right: -6px;
  background: var(--cream); color: var(--green-dark);
  font-size: 0.6rem; font-weight: 700;
  width: 16px; height: 16px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--green-main);
}
.nav-profile {
  display: flex; align-items: center; gap: 9px;
  text-decoration: none;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(225,220,208,0.18);
  border-radius: 40px; padding: 5px 14px 5px 5px;
  transition: background 0.2s;
}
.nav-profile:hover { background: rgba(255,255,255,0.16); }
.nav-profile img {
  width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
  border: 2px solid rgba(225,220,208,0.4);
}
.nav-profile span {
  color: var(--cream); font-size: 0.84rem; font-weight: 500;
  white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis;
}


.hero-search {
  background: var(--green-main);
  padding: 3rem 2rem 3.5rem;
  text-align: center;
  position: relative; overflow: hidden;
  animation: fadeDown 0.45s ease both;
}
.hero-search::before {
  content: ''; position: absolute; top: -60px; right: -60px;
  width: 280px; height: 280px;
  background: rgba(58,90,64,0.3); border-radius: 50%;
}
.hero-search::after {
  content: ''; position: absolute; bottom: -80px; left: 30%;
  width: 300px; height: 300px;
  background: rgba(58,90,64,0.15); border-radius: 50%;
}
.hero-search-inner { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
.hero-search h2 {
  font-size: 1.9rem; color: var(--cream); margin-bottom: 0.5rem;
}
.hero-search p { font-size: 0.92rem; color: rgba(225,220,208,0.75); margin-bottom: 1.75rem; }

.search-bar {
  display: flex; align-items: center;
  background: var(--white); border-radius: 50px;
  padding: 6px 6px 6px 18px;
  box-shadow: 0 4px 20px rgba(58,90,64,0.25);
}
.search-bar i { color: var(--text-muted); font-size: 1rem; margin-right: 8px; flex-shrink: 0; }
.search-bar input {
  flex: 1; border: none; outline: none;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.9rem; color: var(--text-dark);
  background: transparent;
}
.search-bar input::placeholder { color: var(--text-muted); }
.btn-search {
  background: var(--green-main); color: var(--cream);
  border: none; border-radius: 40px;
  padding: 10px 22px;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.87rem; font-weight: 600; cursor: pointer;
  transition: background 0.2s;
  white-space: nowrap;
}
.btn-search:hover { background: var(--green-dark); }


.filters-wrap {
  margin: 1.5rem 2rem;
  animation: fadeUp 0.45s ease 0.05s both;
}
.filters-top {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem; flex-wrap: wrap; gap: 10px;
}
.results-count {
  font-size: 0.9rem; font-weight: 600; color: var(--text-muted);
}
.results-count strong { color: var(--green-dark); }
.filter-btns { display: flex; gap: 8px; }
.btn-filter {
  display: flex; align-items: center; gap: 6px;
  background: var(--white); color: var(--green-dark);
  border: 1.5px solid var(--cream); border-radius: 10px;
  padding: 7px 14px; font-family: 'Quicksand', sans-serif;
  font-size: 0.82rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s;
}
.btn-filter:hover { border-color: var(--green-main); background: var(--cream-light); }


.cats {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.cat-pill {
  background: var(--white);
  border: 1.5px solid var(--cream);
  color: var(--green-dark); border-radius: 30px;
  padding: 6px 16px; font-family: 'Quicksand', sans-serif;
  font-size: 0.81rem; font-weight: 600; cursor: pointer;
  transition: all 0.2s;
}
.cat-pill:hover { border-color: var(--green-main); background: var(--cream-light); }
.cat-pill.active {
  background: var(--green-main); color: var(--cream);
  border-color: var(--green-main);
}


.cards-wrap {
  margin: 0 2rem 3rem;
  animation: fadeUp 0.5s ease 0.1s both;
}

/* FIX: align-items: stretch adicionado aqui para igualar a altura
   de todos os cards da mesma linha e alinhar os botões */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: 1.1rem;
  align-items: stretch;
}

.svc-card {
  background: var(--white);
  border-radius: 20px;
  border: 1.5px solid var(--cream);
  overflow: hidden;
  box-shadow: 0 2px 10px rgba(88,129,87,0.07);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  display: flex; flex-direction: column;
  height: 100%;
}
.svc-card:hover {
  transform: translateY(-5px);
  box-shadow: 0 10px 30px rgba(88,129,87,0.15);
}

.svc-img-wrap { position: relative; height: 160px; overflow: hidden; flex-shrink: 0; }
.svc-img-wrap img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.4s ease;
}
.svc-card:hover .svc-img-wrap img { transform: scale(1.05); }
.svc-tag {
  position: absolute; top: 11px; left: 12px;
  background: var(--green-main); color: var(--cream);
  font-size: 0.7rem; font-weight: 600;
  padding: 3px 10px; border-radius: 20px;
  text-transform: uppercase; letter-spacing: 0.4px;
}

.svc-body {
  padding: 1.1rem 1.2rem 1.2rem;
  display: flex; flex-direction: column; flex: 1;
}


.svc-body h3 {
  font-size: 1.05rem;
  color: var(--green-dark);
  margin-bottom: 0.3rem;
  min-height: 2.6em;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.svc-desc {
  font-size: 0.81rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 0.9rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.svc-person {
  display: flex; align-items: center; gap: 9px;
  padding-bottom: 0.8rem;
  border-bottom: 1.5px solid var(--cream);
  margin-bottom: 0.8rem;
}
.svc-person img {
  width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
  border: 2px solid var(--cream);
}
.svc-person-name { font-size: 0.82rem; font-weight: 600; color: var(--green-dark); }

.svc-meta { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
.svc-meta-i {
  display: flex; align-items: center; gap: 5px;
  font-size: 0.78rem; color: var(--text-muted);
}
.svc-meta-i i { color: var(--green-main); }

.btn-saiba {
  width: 100%; border: none; cursor: pointer;
  background: var(--green-main); color: var(--cream);
  border-radius: 10px; padding: 10px;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.87rem; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.2s, transform 0.1s;
  margin-top: auto;
}
.btn-saiba:hover { background: var(--green-dark); }
.btn-saiba:active { transform: scale(0.98); }


.modal-overlay {
  display: none; position: fixed; inset: 0; z-index: 200;
  background: rgba(30,46,31,0.55); backdrop-filter: blur(4px);
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
@keyframes slideUp {
  from { transform: translateY(60px); opacity: 0; }
  to   { transform: translateY(0); opacity: 1; }
}
.modal-pts {
  font-size: 0.8rem; font-weight: 600; color: var(--green-dark);
  background: var(--cream); border-radius: 8px; padding: 4px 10px;
}

.svc-btns { display: flex; gap: 8px; margin-top: auto; }

.btn-duvida,
.btn-saiba {
   border: none; cursor: pointer;
  border-radius: 12px;
  font-size: 0.82rem; font-weight: 700;
  height: 40px;
  font-family: 'Quicksand', sans-serif;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  transition: background 0.2s, color 0.2s, transform 0.12s, box-shadow 0.2s;
  margin-top: 0;

}

.btn-duvida {
  background: var(--cream-light);
  color: var(--green-dark);
  border: 1.5px solid var(--cream);
  padding: 11px 10px;
  flex: 0.50;

}
.btn-duvida:hover {
  background: var(--cream);
  border-color: var(--green-main);
  }
.btn-duvida:active { transform: scale(0.97); }

.btn-saiba {
  background: var(--green-main);
  color: var(--cream);
  border: 1.5px solid transparent; /* ← adicionar isso */
  box-shadow: 0 3px 10px rgba(88,129,87,0.3);
  padding: 11px 13px;
  flex: 0.50;
}
.btn-saiba:hover {
  background: var(--green-dark);
  box-shadow: 0 4px 14px rgba(58,90,64,0.4);
}
.btn-saiba:active { transform: scale(0.97); }

.btn-duvida i, .btn-saiba i { font-size: 0.85rem; }

@keyframes fadeDown {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}


@media (max-width: 768px) {
  body { padding-top: 64px; }
  .nav-links { display: none; }
  .nav-profile span { display: none; }
  .filters-wrap, .cards-wrap { margin-left: 1rem; margin-right: 1rem; }
  .hero-search { padding: 2rem 1rem 2.5rem; }
  .hero-search h2 { font-size: 1.45rem; }
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
    gap: 1.1rem;
    align-items: stretch;
  }
}

<section class="hero-search">
  <div class="hero-search-inner">
    <h2>Encontre Serviços na Sua Comunidade</h2>
    <p>Troque serviços com pessoas próximas e faça parte de uma economia colaborativa.</p>
    <div class="search-bar">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="Buscar serviços..." oninput="filterCards()">
      <button class="btn-search" type="button" onclick="filterCards()">Buscar</button>
    </div>
  </div>
</section>


<div class="filters-wrap">
  <div class="filters-top">
    <span class="results-count"><strong id="countLabel">0</strong> serviços encontrados</span>
    <div class="filter-btns">
      <button class="btn-filter"><i class="bi bi-funnel"></i> Filtros</button>
      <button class="btn-filter"><i class="bi bi-arrow-down-up"></i> Ordenar</button>
    </div>
  </div>
  <div class="cats" id="listaCategorias">
    <button class="cat-pill active" data-cat="todos" onclick="filterCat(this)">Todos</button>
    
  </div>
</div>


<div class="cards-wrap">
  <div class="cards-grid" id="cardsGrid">
    
  </div>
</div>

<script>


  let todosServicos = [];
  let categoriaAtiva = 'todos';

  function resolverImagem(caminho) {
    if (!caminho) return '../imagens/mutuoLogo.png';
    if (caminho.startsWith('http')) return caminho;
    return `${API_URL}${caminho}`;
  }

  async function carregarServicos() {
  try {
    const resp = await fetch(`${API_URL}/servicos-usuario`);
    if (!resp.ok) throw new Error('Erro ao buscar serviços');
    let servicos = await resp.json();

    // Remove os serviços do próprio usuário logado
    const usuarioLogadoStr = sessionStorage.getItem('usuarioLogado');
    const usuarioLogado = usuarioLogadoStr ? JSON.parse(usuarioLogadoStr) : null;
    if (usuarioLogado?.cpf) {
      servicos = servicos.filter(s => String(s.idUsuario) !== String(usuarioLogado.cpf));
    }

    todosServicos = servicos;

    montarCategorias(todosServicos);
    aplicarFiltros(); // usa o termo/categoria já selecionados, evita sobrescrever busca em andamento
  } catch (err) {
    console.error('Erro ao carregar serviços:', err);
    document.getElementById('cardsGrid').innerHTML =
      `<p style="color:var(--text-muted)">Não foi possível carregar os serviços agora. Tente novamente mais tarde.</p>`;
  }
}

  function montarCategorias(servicos) {
    const container = document.getElementById('listaCategorias');
    const focosUnicos = [...new Set(servicos.map(s => s.foco).filter(Boolean))];

    focosUnicos.forEach(foco => {
      const btn = document.createElement('button');
      btn.className = 'cat-pill';
      btn.dataset.cat = foco;
      btn.textContent = foco;
      btn.onclick = () => filterCat(btn);
      container.appendChild(btn);
    });
  }

  function filterCat(botao) {
    document.querySelectorAll('.cat-pill').forEach(p => p.classList.remove('active'));
    botao.classList.add('active');
    categoriaAtiva = botao.dataset.cat;
    aplicarFiltros();
  }

  function filterCards() {
    const termo = document.getElementById('searchInput').value.toLowerCase();
    const filtrados = todosServicos.filter(s => {
      const bateCat = categoriaAtiva === 'todos' || s.foco === categoriaAtiva;
      const bateTermo = !termo ||
        s.nome.toLowerCase().includes(termo) ||
        (s.descricao || '').toLowerCase().includes(termo);
      return bateCat && bateTermo;
    });
    renderizarCards(filtrados);
  }

  function aplicarFiltros() {
    filterCards();
  }

  function renderizarCards(servicos) {
    const grade = document.getElementById('cardsGrid');
    document.getElementById('countLabel').textContent = servicos.length;

    if (servicos.length === 0) {
      grade.innerHTML = `<p style="color:var(--text-muted)">Nenhum serviço encontrado.</p>`;
      return;
    }

    grade.innerHTML = servicos.map(s => `
      <div class="svc-card">
        <div class="svc-img-wrap">
          <img src="${resolverImagem(s.imagem)}" alt="${s.nome}">
          <span class="svc-tag">${s.foco || ''}</span>
          <span class="modal-pts" style="position:absolute;top:11px;right:12px;font-size:0.7rem;padding:3px 10px;"><i class="bi bi-star-fill"></i> ${s.pontos || 0} pts</span>
        </div>
        <div class="svc-body">
          <h3>${s.nome}</h3>
          <p class="svc-desc">${s.descricao || ''}</p>
          <div class="svc-person">
            <img src="${resolverImagem(s.fotoUsuario)}" alt="${s.nomeUsuario}">
            <div>
              <div class="svc-person-name">${s.nomeUsuario}</div>
            </div>
          </div>
          <div class="svc-meta">
            <span class="svc-meta-i"><i class="bi bi-geo-alt-fill"></i> ${s.cidade || ''}${s.estado ? ', ' + s.estado : ''}</span>
            <span class="svc-meta-i"><i class="bi bi-clock-fill"></i> ${s.qtdHoras || ''}h</span>
          </div>
          <div class="svc-btns">
          <button class="btn-duvida" onclick="tirarDuvidas(${s.cod})"><i class="bi bi-chat-dots-fill"></i> Tirar dúvidas</button>
          <button class="btn-saiba" onclick="inscreverServico(${s.cod}, todosServicos)"><i class="bi bi-check-circle-fill"></i> Solicitar</button>
        </div>
        </div>
      </div>
    `).join('');
  }

  function abrirModalServico(cod) {
    const s = todosServicos.find(item => item.cod === cod);
    if (!s) return;

    document.getElementById('modalImagem').src = resolverImagem(s.imagem);
    document.getElementById('modalTitulo').textContent = s.nome;
    document.getElementById('modalDescricao').textContent = s.descricao || '';
    document.getElementById('modalFotoUsuario').src = resolverImagem(s.fotoUsuario);
    document.getElementById('modalNomeUsuario').textContent = s.nomeUsuario;
    document.getElementById('modalMetaUsuario').innerHTML =
      `<i class="bi bi-geo-alt-fill" style="color:var(--green-main)"></i> ${s.cidade || ''}${s.estado ? ', ' + s.estado : ''} &nbsp;·&nbsp;
       <i class="bi bi-clock-fill" style="color:var(--green-main)"></i> ${s.qtdHoras || ''}h`;
    document.getElementById('modalPontos').textContent = `${s.pontos || 0} pontos necessários`;

    openModal('modalServico');
  }

  function openModal(id) {
    document.getElementById(id).classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeModal(id) {
    document.getElementById(id).classList.remove('open');
    document.body.style.overflow = '';
  }
  document.querySelectorAll('.modal-overlay').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); });
  });

  window.addEventListener('load', () => {
    carregarServicos();
  });

  const usuario = JSON.parse(sessionStorage.getItem("usuarioLogado"));

  if (usuario) {

async function inscreverServico(cod, servicos) {
  const usuarioLogadoStr = sessionStorage.getItem('usuarioLogado');
  const usuarioLogado = usuarioLogadoStr ? JSON.parse(usuarioLogadoStr) : null;

  if (!usuarioLogado || !usuarioLogado.cpf) {
    alert('Você precisa estar logado para se inscrever em um serviço.');
    return;
  }

  const servico = servicos.find(s => s.cod === cod);
  if (!servico) {
    alert('Serviço não encontrado.');
    return;
  }

  try {
    const resp = await fetch(`${API_URL}/solicitacoes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        codServico: cod,
        codUsuario: usuarioLogado.cpf,
        pontos: servico.pontos || 0
      })
    });

    const data = await resp.json();
    if (!resp.ok || data.error) throw new Error(data.error || 'Erro ao enviar solicitação.');

    alert('Solicitação enviada! Aguarde a aprovação do prestador do serviço.');
  } catch (err) {
    console.error('Erro ao se inscrever no serviço:', err);
    alert('Não foi possível enviar a solicitação. Tente novamente.');
  }
}
