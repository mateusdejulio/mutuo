<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mútuo | Chat</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="../imagens/mutuoLogo.png">
  <style>
    :root {
      --green-main: #588157;
      --green-dark: #3a5a40;
      --green-light: #6b9e4a;
      --cream: #E1DCD0;
      --sidebar-w: 320px;
      --nav-h: 72px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: #f4f6f3;
      color: #1a2e1b;
      overflow: hidden;
      height: 100vh;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
      background-color: #588157;
      height: var(--nav-h);
      display: flex; align-items: center;
      padding: 0 2rem;
      box-shadow: 0 2px 16px rgba(58,90,64,0.25);
    }

    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none;
      font-size: 1.55rem;
      color: var(--cream);
      letter-spacing: 0.4px;
      margin-right: 2rem;
      flex-shrink: 0;
    }
    .nav-brand img { width: 38px; height: 38px; border-radius: 8px; }

    .nav-links {
      display: flex; align-items: center; gap: 2px;
      list-style: none; flex: 1;
      margin: 0; padding: 0;
    }
    .nav-links a {
      text-decoration: none;
      color: rgba(225,220,208,0.82);
      font-size: 0.875rem; font-weight: 500;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      transition: color 0.18s, background 0.18s;
      white-space: nowrap;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--cream);
      background: rgba(255,255,255,0.12);
    }

    .nav-dropdown { position: relative; }
    .nav-dropdown > a { display: flex; align-items: center; gap: 5px; }
    .dropdown-panel {
      display: none;
      position: absolute; top: 100%; left: 0;
      padding-top: 10px;
      min-width: 215px;
    }
    .dropdown-panel-inner {
      background: #3a5a40;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 28px rgba(0,0,0,0.22);
      border: 1px solid rgba(225,220,208,0.1);
    }
    .nav-dropdown:hover .dropdown-panel { display: block; }
    .dropdown-panel a {
      display: flex; align-items: center; gap: 9px;
      color: rgba(225,220,208,0.8);
      padding: 0.65rem 1.1rem;
      font-size: 0.84rem;
      text-decoration: none;
    }
    .dropdown-panel a:hover { background: rgba(255,255,255,0.08); color: var(--cream); }
    .dropdown-panel a.danger { color: rgba(255,140,140,0.75); border-top: 1px solid rgba(225,220,208,0.1); }

    .nav-right { display: flex; align-items: center; gap: 1rem; margin-left: auto; }

    .nav-bell {
      position: relative; cursor: pointer;
      color: var(--cream); font-size: 1.25rem;
      opacity: 0.8; transition: opacity 0.2s;
      text-decoration: none;
    }
    .nav-bell:hover { opacity: 1; }
    .bell-badge {
      position: absolute; top: -5px; right: -6px;
      background: var(--cream); color: #3a5a40;
      font-size: 0.6rem; font-weight: 700;
      width: 16px; height: 16px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #588157;
    }
    .nav-chat-badge {
      display: none;
      position: absolute;
      top: 2px; right: -10px;
      background: var(--cream); color: #3a5a40;
      font-size: 0.62rem; font-weight: 700;
      min-width: 15px; height: 15px; border-radius: 8px;
      align-items: center; justify-content: center;
      padding: 0 4px;
      border: 1px solid #588157;
    }

    .nav-profile {
      display: flex; align-items: center; gap: 9px;
      text-decoration: none;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(225,220,208,0.18);
      border-radius: 40px;
      padding: 5px 14px 5px 5px;
    }
    .nav-profile img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(225,220,208,0.4); }
    .nav-profile span { color: var(--cream); font-size: 0.84rem; font-weight: 500; }

    /* ── LAYOUT PRINCIPAL ── */
    .chat-shell {
      display: flex;
      height: 100vh;
      padding-top: var(--nav-h);
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: #fff;
      border-right: 1px solid #e4e8e3;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .sidebar-top {
      padding: 20px 16px 12px;
      border-bottom: 1px solid #e4e8e3;
    }

    .sidebar-top h5 {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--green-dark);
      margin-bottom: 12px;
    }

    .search-wrap {
      position: relative;
    }
    .search-wrap i {
      position: absolute;
      left: 12px; top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 0.85rem;
    }
    .search-wrap input {
      width: 100%;
      padding: 9px 12px 9px 34px;
      border: 1px solid #dde3da;
      border-radius: 20px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.84rem;
      color: #1a2e1b;
      background: #f4f6f3;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    .search-wrap input:focus {
      border-color: var(--green-main);
      background: #fff;
    }

    /* ── LISTA DE CONVERSAS ── */
    .chat-list {
      flex: 1;
      overflow-y: auto;
    }
    .chat-list::-webkit-scrollbar { width: 4px; }
    .chat-list::-webkit-scrollbar-track { background: transparent; }
    .chat-list::-webkit-scrollbar-thumb { background: #cdd5c9; border-radius: 4px; }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid #f0f2ef;
      transition: background 0.15s;
      text-decoration: none;
      color: inherit;
    }
    .chat-item:hover { background: #f4f6f3; }
    .chat-item.active { background: #eaf2e6; }

    .chat-avatar {
      position: relative;
      flex-shrink: 0;
    }
    .chat-avatar img {
      width: 46px; height: 46px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e4e8e3;
    }
    .online-dot {
      position: absolute;
      bottom: 1px; right: 1px;
      width: 11px; height: 11px;
      background: #4caf50;
      border-radius: 50%;
      border: 2px solid #fff;
    }

    .chat-meta {
      flex: 1;
      min-width: 0;
    }
    .chat-meta-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 3px;
    }
    .chat-meta-top span {
      font-size: 0.84rem;
      font-weight: 700;
      color: #1a2e1b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-meta-top small {
      font-size: 0.72rem;
      color: #9aab96;
      flex-shrink: 0;
      margin-left: 8px;
    }
    .chat-preview {
      font-size: 0.78rem;
      color: #7a8c76;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .unread-badge {
      flex-shrink: 0;
      background: var(--green-main);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      min-width: 18px; height: 18px;
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 5px;
    }

    /* ── ÁREA PRINCIPAL ── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100%;
      background: #f4f6f3;
    }

    /* ── CABEÇALHO DO CHAT ABERTO ── */
    .chat-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: #fff;
      border-bottom: 1px solid #e4e8e3;
      flex-shrink: 0;
    }
    .chat-header img {
      width: 42px; height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e4e8e3;
    }
    .chat-header-info { flex: 1; }
    .chat-header-info strong {
      display: block;
      font-size: 0.95rem;
      font-weight: 700;
      color: #1a2e1b;
    }
    .chat-header-info span {
      font-size: 0.75rem;
      color: #4caf50;
      font-weight: 600;
    }

    .chat-header-actions {
      display: flex;
      gap: 8px;
    }
    .header-btn {
      width: 36px; height: 36px;
      border: 1px solid #dde3da;
      border-radius: 10px;
      background: transparent;
      color: #7a8c76;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s, color 0.15s;
    }
    .header-btn:hover { background: #eaf2e6; color: var(--green-dark); }

    .header-menu { position: relative; }
    .header-menu-panel {
      display: none;
      position: absolute;
      top: 110%; right: 0;
      background: #fff;
      border: 1px solid #e4e8e3;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.14);
      overflow: hidden;
      min-width: 180px;
      z-index: 10;
    }
    .header-menu-panel.open { display: block; }
    .header-menu-panel button {
      display: flex; align-items: center; gap: 8px;
      width: 100%;
      padding: 11px 14px;
      border: none;
      background: transparent;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      color: #b00020;
      cursor: pointer;
      text-align: left;
    }
    .header-menu-panel button:hover { background: #fdeaea; }

    /* ── MENSAGENS ── */
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .messages-area::-webkit-scrollbar { width: 4px; }
    .messages-area::-webkit-scrollbar-thumb { background: #cdd5c9; border-radius: 4px; }

    .date-divider {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: #9aab96;
      margin: 4px 0;
    }
    .date-divider span {
      background: #e4ebe2;
      padding: 3px 12px;
      border-radius: 20px;
    }

    .msg-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .msg-row.mine {
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }

    .bubble {
      max-width: 68%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 0.875rem;
      line-height: 1.5;
      position: relative;
    }
    .bubble.theirs {
      background: #fff;
      border: 1px solid #e4e8e3;
      border-bottom-left-radius: 4px;
      color: #1a2e1b;
    }
    .bubble.mine {
      background: var(--green-main);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble-time {
      font-size: 0.67rem;
      margin-top: 4px;
      opacity: 0.6;
      text-align: right;
    }
    .bubble.theirs .bubble-time { color: #7a8c76; }
    .bubble.mine .bubble-time { color: rgba(255,255,255,0.8); }

    /* ── INPUT ÁREA ── */
    .input-area {
      padding: 14px 20px;
      background: #fff;
      border-top: 1px solid #e4e8e3;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .msg-input-wrap {
      flex: 1;
      position: relative;
    }
    .msg-input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #dde3da;
      border-radius: 24px;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.88rem;
      color: #1a2e1b;
      background: #f4f6f3;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      resize: none;
    }
    .msg-input:focus {
      border-color: var(--green-main);
      background: #fff;
    }
    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: none;
      background: var(--green-main);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s, transform 0.15s;
      flex-shrink: 0;
    }
    .send-btn:hover { background: var(--green-dark); }
    .send-btn:active { transform: scale(0.93); }

    /* ── TELA VAZIA (nenhuma conversa selecionada) ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      gap: 12px;
      color: #9aab96;
    }
    .empty-state img {
      width: 140px;
      opacity: 0.3;
      margin-bottom: 4px;
    }
    .empty-state p {
      font-size: 0.95rem;
      font-weight: 700;
      color: #7a8c76;
    }
    .empty-state span {
      font-size: 0.8rem;
      color: #b0bfac;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 680px) {
      .sidebar { width: 100%; display: none; }
      .sidebar.open { display: flex; position: fixed; top: var(--nav-h); left: 0; bottom: 0; z-index: 900; }
    }
  </style>
  <link rel="stylesheet" href="../navbarOngResponsiva.css">
  <script src="../navbarUsuarioResponsiva.js" defer></script>
</head>

  <!-- SHELL -->
  <div class="chat-shell">

    <!-- SIDEBAR -->

  <script src="../funcoes.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="../chat-socket.js"></script>
  <script>
    let usuario = null;
    let conversas = [];
    let conversaAbertaId = null;
    let conversaAbertaNome = '';
    let conversaAbertaFoto = '';

    function resolverImagem(caminho) {
      if (!caminho) return '../imagens/mutuoLogo.png';
      if (caminho.startsWith('http')) return caminho;
      return `${API_URL}${caminho}`;
    }

    function iniciaisUrl(nome) {
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(nome || '?')}&background=588157&color=fff`;
    }

    function formatarHora(dataStr) {
      if (!dataStr) return '';
      const d = new Date(dataStr);
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      return `${h}:${m}`;
    }

    function conversasFiltradas() {
      const termo = (document.getElementById('search-input').value || '').trim().toLowerCase();
      if (!termo) return conversas;
      return conversas.filter(c => (c.nomeOutraConta || '').toLowerCase().includes(termo));
    }

    function atualizarSidebar() {
      renderSidebar(conversasFiltradas());
    }

    function renderSidebar(lista) {
      const container = document.getElementById('chat-list');

      if (!lista.length) {
        container.innerHTML = `<p style="padding:20px;color:#9aab96;font-size:0.85rem;text-align:center;">Nenhuma conversa ainda.</p>`;
        return;
      }

      container.innerHTML = lista.map(c => `
        <a href="#" class="chat-item${c.id === conversaAbertaId ? ' active' : ''}" data-conversa-id="${c.id}">
          <div class="chat-avatar">
            <img src="${resolverImagem(c.fotoOutraConta)}" alt="${c.nomeOutraConta || ''}" onerror="this.src='${iniciaisUrl(c.nomeOutraConta)}'">
          </div>
          <div class="chat-meta">
            <div class="chat-meta-top">
              <span>${c.nomeOutraConta || 'Conta'}</span>
              <small>${formatarHora(c.ultimaMensagemEm)}</small>
            </div>
            <p class="chat-preview">${c.ultimaMensagem || 'Nenhuma mensagem ainda'}</p>
          </div>
          ${c.naoLidas > 0 ? `<span class="unread-badge">${c.naoLidas}</span>` : ''}
        </a>
      `).join('');

      container.querySelectorAll('.chat-item').forEach(el => {
        el.addEventListener('click', (e) => {
          e.preventDefault();
          const id = Number(el.dataset.conversaId);
          const conv = conversas.find(c => c.id === id);
          if (conv) abrirConversa(conv.id, conv.nomeOutraConta, resolverImagem(conv.fotoOutraConta));
        });
      });
    }

    async function carregarConversas() {
      try {
        const resp = await fetch(`${API_URL}/conversas/usuario/${encodeURIComponent(usuario.cpf)}`);
        const dados = await resp.json();
        conversas = Array.isArray(dados) ? dados : [];
        atualizarSidebar();
      } catch (err) {
        console.error('Erro ao carregar conversas:', err);
      }
    }

    async function abrirConversaViaQuery() {
      const params = new URLSearchParams(location.search);
      const tipo = params.get('tipo');
      const id = params.get('id');
      const nome = params.get('nome');
      const foto = params.get('foto');
      if (!tipo || !id) return;

      try {
        const resp = await fetch(`${API_URL}/conversas`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipo1: 'usuario', id1: usuario.cpf, tipo2: tipo, id2: id })
        });
        const dados = await resp.json();
        if (!dados.sucesso) throw new Error(dados.erro || 'Erro ao abrir conversa.');

        const conversaId = dados.conversa.id;
        const existente = conversas.find(c => c.id === conversaId);
        const nomeFinal = existente?.nomeOutraConta || nome || 'Conta';
        const fotoFinal = existente ? resolverImagem(existente.fotoOutraConta) : (foto || '../imagens/mutuoLogo.png');

        await abrirConversa(conversaId, nomeFinal, fotoFinal);
      } catch (err) {
        console.error('Erro ao abrir conversa via query string:', err);
      } finally {
        history.replaceState({}, '', location.pathname);
      }
    }

    function criarBubbleHtml(m) {
      const mine = m.tipo_remetente === 'usuario' && String(m.id_remetente) === String(usuario.cpf);
      const hora = formatarHora(m.enviada_em);

      if (mine) {
        return `<div class="msg-row mine"><div class="bubble mine">${m.conteudo}<div class="bubble-time">${hora} <i class="bi bi-check2"></i></div></div></div>`;
      }

      const avatar = conversaAbertaFoto || '../imagens/mutuoLogo.png';
      return `<div class="msg-row">
        <img class="msg-avatar" src="${avatar}" onerror="this.src='${iniciaisUrl(conversaAbertaNome)}'" alt="${conversaAbertaNome}">
        <div class="bubble theirs">${m.conteudo}<div class="bubble-time">${hora}</div></div>
      </div>`;
    }

    let ultimoDivisorKey = null;

    function chaveData(dataStr) {
      return new Date(dataStr).toDateString();
    }

    function formatarDivisorData(dataStr) {
      const data = new Date(dataStr);
      const hoje = new Date();
      const ontem = new Date();
      ontem.setDate(hoje.getDate() - 1);

      if (chaveData(dataStr) === chaveData(hoje)) return 'Hoje';
      if (chaveData(dataStr) === chaveData(ontem)) return 'Ontem';

      const opcoes = data.getFullYear() === hoje.getFullYear()
        ? { day: 'numeric', month: 'long' }
        : { day: 'numeric', month: 'long', year: 'numeric' };
      return data.toLocaleDateString('pt-BR', opcoes);
    }

    function bubbleComDivisor(m) {
      let html = '';
      const chave = chaveData(m.enviada_em);
      if (chave !== ultimoDivisorKey) {
        html += `<div class="date-divider"><span>${formatarDivisorData(m.enviada_em)}</span></div>`;
        ultimoDivisorKey = chave;
      }
      return html + criarBubbleHtml(m);
    }

    function renderMensagens(mensagens) {
      const area = document.getElementById('messages-area');
      ultimoDivisorKey = null;
      area.innerHTML = mensagens.map(bubbleComDivisor).join('');
      area.scrollTop = area.scrollHeight;
    }

    function anexarMensagem(m) {
      const area = document.getElementById('messages-area');
      area.insertAdjacentHTML('beforeend', bubbleComDivisor(m));
      area.scrollTop = area.scrollHeight;
    }

    async function abrirConversa(conversaId, nome, fotoUrl) {
      conversaAbertaId = conversaId;
      conversaAbertaNome = nome;
      conversaAbertaFoto = fotoUrl;

      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('chat-header').style.display = 'flex';
      document.getElementById('messages-area').style.display = 'flex';
      document.getElementById('input-area').style.display = 'flex';

      document.getElementById('header-name').textContent = nome;
      const img = document.getElementById('header-avatar');
      img.onerror = () => img.src = iniciaisUrl(nome);
      img.src = fotoUrl || '../imagens/mutuoLogo.png';
      document.getElementById('header-status').style.display = 'none';

      atualizarSidebar();

      document.getElementById('messages-area').innerHTML = '';

      try {
        const resp = await fetch(`${API_URL}/conversas/${conversaId}/mensagens?tipo=usuario&id=${encodeURIComponent(usuario.cpf)}`);
        const mensagens = await resp.json();
        renderMensagens(Array.isArray(mensagens) ? mensagens : []);
      } catch (err) {
        console.error('Erro ao carregar mensagens:', err);
      }

      const conv = conversas.find(c => c.id === conversaId);
      if (conv) conv.naoLidas = 0;
      atualizarSidebar();

      MutuoChat.marcarComoLida(conversaId);
    }

    function atualizarPreviewConversa(mensagem, { incrementarNaoLidas }) {
      const index = conversas.findIndex(c => c.id === mensagem.conversa_id);
      if (index === -1) { carregarConversas(); return; }

      const atual = conversas.splice(index, 1)[0];
      atual.ultimaMensagem = mensagem.conteudo;
      atual.ultimaMensagemEm = mensagem.enviada_em;
      if (incrementarNaoLidas) atual.naoLidas = (Number(atual.naoLidas) || 0) + 1;
      conversas.unshift(atual);
      atualizarSidebar();
    }

    function sendMessage() {
      const input = document.getElementById('msg-input');
      const texto = input.value.trim();
      if (!texto || !conversaAbertaId) return;

      const otimista = {
        conversa_id: conversaAbertaId,
        tipo_remetente: 'usuario',
        id_remetente: usuario.cpf,
        conteudo: texto,
        enviada_em: new Date().toISOString()
      };
      anexarMensagem(otimista);
      MutuoChat.enviarMensagem(conversaAbertaId, texto);
      input.value = '';

      atualizarPreviewConversa(otimista, { incrementarNaoLidas: false });
    }

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function toggleHeaderMenu() {
      document.getElementById('header-menu-panel').classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
      const menu = document.getElementById('header-menu');
      if (menu && !menu.contains(e.target)) {
        document.getElementById('header-menu-panel').classList.remove('open');
      }
    });

    async function apagarConversaAtual() {
      document.getElementById('header-menu-panel').classList.remove('open');
      if (!conversaAbertaId) return;

      const confirmou = confirm('As mensagens vão desaparecer só do seu lado. A outra conta continua vendo o histórico normalmente. Deseja apagar esta conversa?');
      if (!confirmou) return;

      try {
        const resp = await fetch(`${API_URL}/conversas/${conversaAbertaId}/limpar`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tipo: 'usuario', id: usuario.cpf })
        });
        const dados = await resp.json();
        if (!dados.sucesso) throw new Error(dados.erro || 'Erro ao apagar conversa.');

        document.getElementById('messages-area').innerHTML = '';
        const conv = conversas.find(c => c.id === conversaAbertaId);
        if (conv) { conv.ultimaMensagem = null; conv.naoLidas = 0; }
        atualizarSidebar();
      } catch (err) {
        console.error('Erro ao apagar conversa:', err);
        alert('Não foi possível apagar a conversa.');
      }
    }

    async function iniciar() {
      usuario = JSON.parse(sessionStorage.getItem('usuarioLogado') || 'null');
      if (!usuario || !usuario.cpf) {
        window.location.href = '../login.html';
        return;
      }

      document.getElementById('nomeUsuario').textContent = usuario.nome || usuario.nome_usuario || '';

      MutuoChat.conectar();
      MutuoChat.onMensagemNova((mensagem) => {
        if (mensagem.conversa_id === conversaAbertaId) {
          anexarMensagem(mensagem);
          MutuoChat.marcarComoLida(conversaAbertaId);
          atualizarPreviewConversa(mensagem, { incrementarNaoLidas: false });
        } else {
          atualizarPreviewConversa(mensagem, { incrementarNaoLidas: true });
        }
      });
      MutuoChat.onMensagemEnviada((mensagem) => {
        atualizarPreviewConversa(mensagem, { incrementarNaoLidas: false });
      });

      await carregarConversas();
      await abrirConversaViaQuery();

      carregarFoto();
      atualizarBadgeNotificacoes();
    }

    window.addEventListener('load', iniciar);
  </script>
 
</body>
